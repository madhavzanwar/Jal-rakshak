weight="400" fill="#4A5D73" text-anchor="start">Hourly rainfall: next 72 h</text><text x="62" y="188" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">+ observed past 7 days</text><line x1="340" y1="161.0" x2="384" y2="161.0" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah-0E7C86)"/><rect x="40" y="266" width="300" height="150" rx="16" fill="#FFFFFF" stroke="#C9D6E2" stroke-width="2"/><text x="62" y="310" font-size="22" font-weight="700" fill="#12263F" text-anchor="start">GloFAS (Copernicus)</text><text x="62" y="346" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">River discharge forecast via</text><text x="62" y="368" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">Open-Meteo Flood API</text><line x1="340" y1="341.0" x2="384" y2="341.0" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah-0E7C86)"/><rect x="40" y="446" width="300" height="150" rx="16" fill="#FFFFFF" stroke="#C9D6E2" stroke-width="2"/><text x="62" y="490" font-size="22" font-weight="700" fill="#12263F" text-anchor="start">GloFAS reanalysis</text><text x="62" y="526" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">~40 yrs of discharge →</text><text x="62" y="548" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">percentile danger thresholds</text><line x1="340" y1="521.0" x2="384" y2="521.0" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah-0E7C86)"/><rect x="40" y="626" width="300" height="150" rx="16" fill="#FFFFFF" stroke="#C9D6E2" stroke-width="2"/><text x="62" y="670" font-size="22" font-weight="700" fill="#12263F" text-anchor="start">OpenStreetMap</text><text x="62" y="706" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">Basemap tiles + Nominatim</text><text x="62" y="728" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">geocoding for citizen search</text><line x1="340" y1="701.0" x2="384" y2="701.0" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah-0E7C86)"/><rect x="40" y="806" width="300" height="150" rx="16" fill="#FFFFFF" stroke="#C9D6E2" stroke-width="2"/><text x="62" y="850" font-size="22" font-weight="700" fill="#12263F" text-anchor="start">OSRM routing</text><text x="62" y="886" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">Road routes to shelters</text><text x="62" y="908" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">(straight-line fallback)</text><line x1="340" y1="881.0" x2="384" y2="881.0" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah-0E7C86)"/><text x="392" y="62" font-size="15" font-weight="700" fill="#0E7C86" text-anchor="start">ADAPTERS + CACHE</text><rect x="392" y="86" width="250" height="870" rx="16" fill="#EEF4FA" stroke="#C9D6E2" stroke-width="2"/><text x="414" y="134" font-size="22" font-weight="700" fill="#12263F" text-anchor="start">Data adapters</text><text x="414" y="172" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">Async HTTP client</text><text x="414" y="194" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">retry + backoff</text><text x="414" y="216" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">per-source timeouts</text><rect x="410" y="270" width="214" height="190" rx="16" fill="#FFFFFF" stroke="#C9D6E2" stroke-width="2"/><text x="428" y="308" font-size="19" font-weight="700" fill="#12263F" text-anchor="start">JSON disk cache</text><text x="428" y="342" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">TTL per source</text><text x="428" y="363" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">stale-on-error</text><text x="428" y="384" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">fallback → UI</text><text x="428" y="405" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">shows &quot;stale&quot;</text><rect x="410" y="490" width="214" height="168" rx="16" fill="#FFFFFF" stroke="#C9D6E2" stroke-width="2"/><text x="428" y="528" font-size="19" font-weight="700" fill="#12263F" text-anchor="start">City seed</text><text x="428" y="562" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">12 cities, wards,</text><text x="428" y="583" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">gauges, shelters</text><text x="428" y="604" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">(synthetic, labelled)</text><text x="414" y="720" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">Works offline on</text><text x="414" y="744" font-size="17" font-weight="400" fill="#4A5D73" text-anchor="start">last-known data</text><line x1="642" y1="300" x2="688" y2="300" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah-0E7C86)"/><text x="690" y="62" font-size="15" font-weight="700" fill="#0E7C86" text-anchor="start">RISK ENGINE (DETERMINISTIC)</text><rect x="690" y="86" width="320" height="560" rx="16" fill="#FFFFFF" stroke="#0E7C86" stroke-width="3"/><text x="712" y="134" font-size="22" font-weight="700" fill="#12263F" text-anchor="start">Ward flood-risk score</text><rect x="712" y="168" width="14" height="46" rx="7" fill="#2A7FC1" stroke="#2A7FC1" stroke-width="0"/><text x="740" y="188" font-size="18" font-weight="700" fill="#12263F" text-anchor="start">Rain</text><text x="740" y="210" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">IMD 24 h categories</text><rect x="712" y="238" width="14" height="46" rx="7" fill="#0E7C86" stroke="#0E7C86" stroke-width="0"/><text x="740" y="258" font-size="18" font-weight="700" fill="#12263F" text-anchor="start">River</text><text x="740" y="280" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">GloFAS peak ÷ danger</text><rect x="712" y="308" width="14" height="46" rx="7" fill="#7A8B9E" stroke="#7A8B9E" stroke-width="0"/><text x="740" y="328" font-size="18" font-weight="700" fill="#12263F" text-anchor="start">Antecedent</text><text 