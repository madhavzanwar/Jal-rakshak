[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jalrakshak"
version = "0.1.0"
description = "JalRakshak - agentic flood early-warning platform for India (backend)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "reportlab>=4.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "anyio>=4",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
]
ml = [
  # optional LightGBM flood-day model (jalrakshak.ml); runtime needs only lightgbm
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["jalrakshak*"]

[tool.setuptools.package-data]
jalrakshak = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # formatter owns line width; long strings allowed

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with:DeprecationWarning"]
