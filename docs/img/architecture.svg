) per city</text><text x="712" y="791" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">honest time-split backtest</text><text x="712" y="812" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">trained on GloFAS +</text><text x="712" y="833" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">ERA5 reanalysis (1991–2024)</text><line x1="850" y1="690" x2="850" y2="650" stroke="#5B4DB7" stroke-width="3" marker-end="url(#ah-5B4DB7)"/><line x1="1010" y1="300" x2="1054" y2="300" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah-0E7C86)"/><text x="1056" y="62" font-size="15" font-weight="700" fill="#F08A24" text-anchor="start">AGENT LAYER · OWN REACT TOOL-CALLING LOOP</text><rect x="1056" y="86" width="450" height="700" rx="16" fill="#FFF1E3" stroke="#F08A24" stroke-width="3"/><rect x="1078" y="108" width="406" height="84" rx="16" fill="#FFFFFF" stroke="#F3C08E" stroke-width="2"/><text x="1100" y="144" font-size="20" font-weight="700" fill="#12263F" text-anchor="start">1  Monitor</text><text x="1124" y="172" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">decides whether to alert</text><line x1="1281" y1="192" x2="1281" y2="210" stroke="#F08A24" stroke-width="2.5" marker-end="url(#ah-F08A24)"/><rect x="1078" y="212" width="406" height="84" rx="16" fill="#FFFFFF" stroke="#F3C08E" stroke-width="2"/><text x="1100" y="248" font-size="20" font-weight="700" fill="#12263F" text-anchor="start">2  Alert drafter</text><text x="1124" y="276" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">SMS ≤160 + WhatsApp, 5 languages</text><line x1="1281" y1="296" x2="1281" y2="314" stroke="#F08A24" stroke-width="2.5" marker-end="url(#ah-F08A24)"/><rect x="1078" y="316" width="406" height="84" rx="16" fill="#FFFFFF" stroke="#F3C08E" stroke-width="2"/><text x="1100" y="352" font-size="20" font-weight="700" fill="#12263F" text-anchor="start">3  Evacuation planner</text><text x="1124" y="380" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">nearest shelter / hospital, OSRM</text><line x1="1281" y1="400" x2="1281" y2="418" stroke="#F08A24" stroke-width="2.5" marker-end="url(#ah-F08A24)"/><rect x="1078" y="420" width="406" height="84" rx="16" fill="#FFFFFF" stroke="#F3C08E" stroke-width="2"/><text x="1100" y="456" font-size="20" font-weight="700" fill="#12263F" text-anchor="start">4  SitRep</text><text x="1124" y="484" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">district-officer report (PDF)</text><rect x="1078" y="532" width="196" height="140" rx="16" fill="#FFFFFF" stroke="#F3C08E" stroke-width="2"/><text x="1094" y="566" font-size="18" font-weight="700" fill="#12263F" text-anchor="start">Guardrails</text><text x="1094" y="594" font-size="15" font-weight="400" fill="#4A5D73" text-anchor="start">numbers = data</text><text x="1094" y="616" font-size="15" font-weight="400" fill="#4A5D73" text-anchor="start">script + length</text><text x="1094" y="638" font-size="15" font-weight="400" fill="#4A5D73" text-anchor="start">must include 112</text><rect x="1288" y="532" width="196" height="140" rx="16" fill="#FFFFFF" stroke="#F3C08E" stroke-width="2"/><text x="1304" y="566" font-size="18" font-weight="700" fill="#12263F" text-anchor="start">Step log</text><text x="1304" y="594" font-size="15" font-weight="400" fill="#4A5D73" text-anchor="start">reasoning, tool</text><text x="1304" y="616" font-size="15" font-weight="400" fill="#4A5D73" text-anchor="start">inputs + outputs</text><text x="1304" y="638" font-size="15" font-weight="400" fill="#4A5D73" text-anchor="start">for every step</text><rect x="1078" y="690" width="406" height="76" rx="12" fill="#F08A24" stroke="#F08A24" stroke-width="2"/><text x="1281" y="724" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Human approval gate</text><text x="1281" y="750" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="middle">nothing is sent without an officer</text><rect x="1056" y="826" width="450" height="130" rx="16" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"/><text x="1078" y="868" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start">Ollama · Qwen2.5 3B (local LLM)</text><text x="1078" y="900" font-size="16" font-weight="400" fill="#C7D6E6" text-anchor="start">runs on the laptop, no cloud LLM / API key</text><text x="1078" y="921" font-size="16" font-weight="400" fill="#C7D6E6" text-anchor="start">deterministic rules fallback if offline</text><line x1="1281" y1="786" x2="1281" y2="824" stroke="#0B1F3A" stroke-width="3" marker-end="url(#ah-0B1F3A)" marker-start="url(#as-0B1F3A)"/><text x="1552" y="62" font-size="15" font-weight="700" fill="#0E7C86" text-anchor="start">SERVE + ACT</text><rect x="1552" y="86" width="330" height="130" rx="16" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"/><text x="1574" y="130" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">FastAPI  /api</text><text x="1574" y="162" font-size="16" font-weight="400" fill="#C7D6E6" text-anchor="start">cities, risk, agents, alerts,</text><text x="1574" y="183" font-size="16" font-weight="400" fill="#C7D6E6" text-anchor="start">sitrep, evacuation, citizen</text><line x1="1506" y1="150" x2="1550" y2="150" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah-0E7C86)"/><line x1="1717" y1="216" x2="1717" y2="256" stroke="#0E7C86" stroke-width="3" marker-end="url(#ah-0E7C86)"/><rect x="1552" y="258" width="330" height="420" rx="16" fill="#FFFFFF" stroke="#0E7C86" stroke-width="3"/><text x="1574" y="302" font-size="22" font-weight="700" fill="#12263F" text-anchor="start">React PWA</text><text x="1574" y="330" font-size="16" font-weight="400" fill="#4A5D73" text-anchor="start">installable · offline-capable</text><rect x="1574" y="352" width="286" height="50" rx="10" fill="#E3F4F5" stroke="#E3F4F5" stroke-width="2"/><text x="1592" y="384" font-size="18" font-weight="600" fill="#12263F" text-anchor="start">Dashboard map</te